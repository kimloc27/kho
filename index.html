<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chúc Mừng Sinh Nhật</title>

    <!-- Kết nối file CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Nhạc tự động phát -->
    <audio autoplay loop>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
    </audio>

    <div class="box">

        <h1>🎉Chúc Mừng Sinh Nhật🎂</h1>

        <!-- Hình bánh sinh nhật -->
        <img src="h2.webp" alt="Bánh sinh nhật">

        <p>Chúc chế có một ngày thật vui vẻ,</p>
        <p>Luôn hạnh phúc và thành công!</p>

        <!-- Nút mở popup -->
        <button class="btn" onclick="showPopup()">
            Nhấn vào đây 🎁
        </button>

    </div>


    <!-- ================= POPUP ================= -->

    <div class="popup" id="birthdayPopup">

        <div class="popup-content">

            <h2>💐 Chúc mừng sinh nhật 🎂</h2>

            <p>
                Chúc chế sinh nhật vui vẻ 💐🎂<br>
                Luôn luôn hạnh phúc 😚<br>
                Và thật nhiều sức khoẻ 🤭<br>
                Thành công trong cuốc sống 🫣<br>
                Làm việc gì cũng suôn sẻ 😚
            </p>

            <!-- Nút đóng popup -->
            <button class="close-btn" onclick="closePopup()">
                Đóng
            </button>

        </div>

    </div>


    <!-- Thư viện pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Kết nối file JavaScript -->
    <script src="script.js"></script>

</body>
</html>
